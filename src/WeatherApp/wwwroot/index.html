<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Current weather, hourly and 10-day forecast for any city in the world.">
    <meta name="theme-color" content="#2e7bd6">
    <title>Weather</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>
<body class="theme-clear-day">
<div class="sky" aria-hidden="true"></div>

<div class="app">
    <!-- Locations sidebar: static on large screens, slide-in panel on phones -->
    <aside id="sidebar" class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" aria-labelledby="sidebar-title">
        <div class="offcanvas-header">
            <h2 class="h4 fw-bold mb-0">Weather</h2>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebar"
                    aria-label="Close"></button>
        </div>

        <div class="offcanvas-body">
            <h1 id="sidebar-title" class="sidebar-title d-none d-lg-block">Weather</h1>

            <form id="search-form" class="search" role="search" autocomplete="off">
                <label for="search-input" class="visually-hidden">Search for a city</label>
                <div class="search-field">
                    <i class="bi bi-search" aria-hidden="true"></i>
                    <input id="search-input" type="search" placeholder="Search for a city"
                           role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results">
                </div>
                <ul id="search-results" class="search-results list-unstyled" role="listbox" hidden></ul>
            </form>

            <ul id="locations" class="locations list-unstyled" aria-label="Saved locations"></ul>
            <p id="locations-empty" class="locations-empty">
                Your saved cities will appear here. Search for a city and tap <strong>Add</strong> to save it.
            </p>

            <p class="sidebar-footer">
                Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
            </p>
        </div>
    </aside>

    <main class="main" id="main">
        <div class="topbar">
            <button id="locate-btn" class="pill-btn d-none d-lg-inline-flex" type="button">
                <i class="bi bi-geo-alt-fill" aria-hidden="true"></i> My Location
            </button>
            <button id="fav-btn" class="pill-btn ms-auto" type="button" aria-pressed="false" hidden></button>
        </div>

        <!-- Current conditions -->
        <section class="hero" aria-live="polite">
            <p id="hero-label" class="hero-label" hidden></p>
            <h2 id="city-name" class="hero-city">&nbsp;</h2>
            <p class="hero-temp"><span id="current-temp">--</span>°</p>
            <p id="current-desc" class="hero-desc">&nbsp;</p>
            <p id="current-range" class="hero-range">&nbsp;</p>
        </section>

        <div id="status" class="status" role="status" hidden></div>

        <div class="content">
            <!-- Hourly -->
            <section class="card-ios hourly-card" aria-labelledby="hourly-title">
                <p id="hourly-summary" class="hourly-summary"></p>
                <h3 id="hourly-title" class="visually-hidden">Hourly forecast</h3>
                <div id="hourly" class="hourly" tabindex="0" aria-label="Hourly forecast, scroll horizontally"></div>
            </section>

            <div class="content-grid">
                <!-- 10-day -->
                <section class="card-ios daily-card" aria-labelledby="daily-title">
                    <h3 id="daily-title" class="card-title"><i class="bi bi-calendar3" aria-hidden="true"></i> 10-Day Forecast</h3>
                    <ul id="daily" class="daily list-unstyled mb-0"></ul>
                </section>

                <!-- Detail tiles -->
                <section aria-labelledby="details-title">
                    <h3 id="details-title" class="visually-hidden">Details</h3>
                    <div id="details" class="tiles"></div>
                </section>
            </div>
        </div>
    </main>
</div>

<!-- Phone toolbar, like the bottom bar in iOS Weather -->
<nav class="bottom-bar d-lg-none" aria-label="Toolbar">
    <button id="locate-btn-mobile" class="bar-btn" type="button" aria-label="Use my location">
        <i class="bi bi-geo-alt" aria-hidden="true"></i>
    </button>
    <button class="bar-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar"
            aria-controls="sidebar" aria-label="Show saved cities and search">
        <i class="bi bi-list-ul" aria-hidden="true"></i>
    </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
</body>
</html>
